<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">

<meta name="theme-color" content="#0E7A4F"><title>Mon anglais en 2 mois</title>
<style>
:root{--f:#F1F6F3;--c:#fff;--e:#12261F;--d:#5B6F66;--v:#0E7A4F;--vc:#DCEFE5;--s:#F2B705;--r:#C9322A;--rc:#FBE3E1;--l:#CFDDD5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--f);color:var(--e);font:18px/1.45 "Trebuchet MS","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;line-height:1.15;margin:6px 0 10px}h2{font-size:21px;margin:14px 0 8px}
button{font:inherit;border:0;border-radius:16px;padding:15px 16px;width:100%;cursor:pointer;margin-bottom:10px;text-align:center}
button:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.g{background:var(--v);color:#fff;font-weight:700;font-size:20px}.k{background:var(--vc);color:var(--v);font-weight:700}
.j{background:var(--s);font-weight:700;font-size:21px;padding:22px}
.o{background:var(--c);border:2px solid var(--l);text-align:left}.o.b{border-color:var(--v);background:var(--vc)}.o.m{border-color:var(--r);background:var(--rc)}
.a{background:var(--s);width:56px;flex:none;margin:0;padding:12px;font-size:22px}
.l{background:none;color:var(--v);width:auto;padding:4px 0;margin:0;text-align:left;font-size:16px;text-decoration:underline}
.bx{background:var(--c);border-radius:18px;padding:14px 16px;margin:12px 0}
.c{display:flex;gap:12px;align-items:center;background:var(--c);border-radius:16px;padding:12px;margin-bottom:10px}
.p{display:flex;gap:10px;align-items:flex-start;background:var(--vc);border-radius:18px;padding:12px 14px;margin:0 0 12px}.p p{margin:0}.p span{font-size:26px}
.en{font-size:22px;font-weight:700}.d{color:var(--d);font-size:16px}.ok{color:var(--v);font-weight:700}.no{color:var(--r);font-weight:700}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--v)}
.gr{display:flex;align-items:flex-end;gap:5px;height:90px;margin:10px 0}.gr i{flex:1;background:var(--v);border-radius:5px 5px 0 0;min-height:4px}
.hero{background:var(--v);color:#fff;border-radius:22px;padding:18px;margin:10px 0 14px}.hero b{font-size:26px;display:block}
details{background:var(--c);border-radius:14px;padding:10px 14px;margin-bottom:8px}summary{font-weight:700;cursor:pointer}
input[type=range]{width:100%}
.q{background:none;color:var(--d);font-size:16px}.ch{width:auto;display:inline-block;margin:4px;padding:10px 14px;background:var(--c);border:2px solid var(--l);border-radius:12px}
</style></head><body><main id="zone"></main>
<script>
(function(){"use strict";
var W=[
["Les bases","« I am » = je suis. Pas de conjugaison : on commence avec des phrases toutes faites.",[
"Good morning, how are you?|Bonjour, comment allez-vous ?","I am fine, thank you.|Je vais bien, merci.","Nice to meet you.|Enchanté.","I am from Cameroon.|Je viens du Cameroun.","I speak French.|Je parle français.","Please, speak slowly.|S’il vous plaît, parlez lentement.","I don’t understand.|Je ne comprends pas.","Can you repeat, please?|Pouvez-vous répéter, s’il vous plaît ?","What does this mean?|Qu’est-ce que ça veut dire ?","Excuse me.|Excusez-moi.","See you tomorrow.|À demain.","Have a nice day.|Bonne journée."],
["Dis bonjour et demande comment va la personne.|Good morning, how are you?","Dis que tu viens du Cameroun.|I am from Cameroon.","Dis que tu ne comprends pas et demande de répéter.|I don’t understand. Can you repeat, please?"]],
["Vie de tous les jours","Présent simple : on ajoute -s seulement pour he/she : I work, she works. C’est presque tout !",[
"I live with my family.|J’habite avec ma famille.","I have two brothers and one sister.|J’ai deux frères et une sœur.","I wake up at six o’clock.|Je me réveille à six heures.","I eat rice and fish.|Je mange du riz et du poisson.","What time is it?|Quelle heure est-il ?","Today is Monday.|Aujourd’hui, c’est lundi.","I am hungry.|J’ai faim.","I am thirsty. Water, please.|J’ai soif. De l’eau, s’il vous plaît.","The house is big.|La maison est grande.","My mother cooks every day.|Ma mère cuisine tous les jours.","I go to work by bus.|Je vais au travail en bus.","I like football.|J’aime le football."],
["Parle de ta famille.|I live with my family.","Dis à quelle heure tu te réveilles.|I wake up at six o’clock.","Dis ce que tu aimes.|I like football."]],
["Acheter, argent, transport","« I want » (je veux), « I need » (j’ai besoin de), « I can » (je peux) + un verbe : tu peux dire presque tout.",[
"How much is this?|Combien ça coûte ?","It is too expensive.|C’est trop cher.","Can I pay by phone?|Puis-je payer par téléphone ?","I want two kilos of tomatoes.|Je veux deux kilos de tomates.","Do you have a smaller size?|Avez-vous une taille plus petite ?","I need change, please.|J’ai besoin de monnaie, s’il vous plaît.","Where is the bus station?|Où est la gare routière ?","I want a ticket to Douala.|Je veux un billet pour Douala.","Turn left, then go straight.|Tournez à gauche, puis allez tout droit.","It is near the market.|C’est près du marché.","Can you give me a discount?|Pouvez-vous me faire une réduction ?","Thank you, keep the change.|Merci, gardez la monnaie."],
["Demande le prix.|How much is this?","Demande où est la gare routière.|Where is the bus station?","Dis que tu as besoin de monnaie.|I need change, please."]],
["Santé et urgences","Passé : on ajoute -ed (I worked). Les verbes courants, retiens-les comme des mots : go → went, have → had.",[
"I don’t feel well.|Je ne me sens pas bien.","I have a headache.|J’ai mal à la tête.","I need to see a doctor.|J’ai besoin de voir un médecin.","Where is the nearest hospital?|Où est l’hôpital le plus proche ?","It hurts here.|J’ai mal ici.","Call an ambulance, please!|Appelez une ambulance, s’il vous plaît !","I went to the pharmacy yesterday.|Je suis allé à la pharmacie hier.","Take this medicine twice a day.|Prenez ce médicament deux fois par jour.","I need help.|J’ai besoin d’aide.","Is it serious?|Est-ce grave ?","I feel better today.|Je me sens mieux aujourd’hui.","Please, call my family.|Appelez ma famille, s’il vous plaît."],
["Dis que tu as mal à la tête.|I have a headache.","Demande de l’aide.|I need help.","Dis que tu es allé à la pharmacie hier.|I went to the pharmacy yesterday."]],
["Vie sociale et émotions","« Would like » = je voudrais, très poli. Pour poser une question, commence par Do / Can / Would you…",[
"Would you like to have lunch with me?|Voudriez-vous déjeuner avec moi ?","I would like to introduce my friend.|Je voudrais présenter mon ami.","I am very happy to see you.|Je suis très content de te voir.","I am sorry, I am late.|Désolé, je suis en retard.","What do you do in your free time?|Que fais-tu pendant ton temps libre ?","I think you are right.|Je pense que tu as raison.","I don’t agree with you.|Je ne suis pas d’accord avec toi.","Let’s meet on Saturday.|Retrouvons-nous samedi.","Congratulations, well done!|Félicitations, bien joué !","I am worried about you.|Je m’inquiète pour toi.","Can I call you later?|Puis-je t’appeler plus tard ?","Thanks for your help.|Merci pour ton aide."],
["Invite quelqu’un à déjeuner.|Would you like to have lunch with me?","Excuse-toi d’être en retard.|I am sorry, I am late.","Dis que tu n’es pas d’accord.|I don’t agree with you."]],
["Travail et bureau","Futur : will + verbe. I will send the file. Toujours will, pour tout le monde. Aucune conjugaison !",[
"I work in an office.|Je travaille dans un bureau.","I will send you the file today.|Je vous enverrai le dossier aujourd’hui.","Can we have a meeting tomorrow?|Pouvons-nous avoir une réunion demain ?","I am working on a project.|Je travaille sur un projet.","Please check your email.|Veuillez vérifier votre courriel.","What is your phone number?|Quel est votre numéro de téléphone ?","I am sorry, the line is bad.|Désolé, la ligne est mauvaise.","I will call you back.|Je vous rappellerai.","We need more time.|Nous avons besoin de plus de temps.","The deadline is on Friday.|La date limite est vendredi.","I would like to apply for this job.|Je voudrais postuler à ce poste.","I have two years of experience.|J’ai deux ans d’expérience."],
["Dis où tu travailles.|I work in an office.","Dis que tu rappelleras.|I will call you back.","Dis que tu as deux ans d’expérience.|I have two years of experience."]],
["Voyager","Pour une question, mets Where / When / How au début. Une seule structure, mille questions.",[
"Where is the airport?|Où est l’aéroport ?","I have a reservation.|J’ai une réservation.","My flight is at ten o’clock.|Mon vol est à dix heures.","Here is my passport.|Voici mon passeport.","Is breakfast included?|Le petit-déjeuner est-il inclus ?","How long is the trip?|Combien de temps dure le voyage ?","I lost my bag.|J’ai perdu mon sac.","Could you take a photo of us?|Pourriez-vous nous prendre en photo ?","What do you recommend?|Que recommandez-vous ?","The bill, please.|L’addition, s’il vous plaît.","Is there Wi-Fi here?|Y a-t-il du Wi-Fi ici ?","I am traveling for two weeks.|Je voyage pendant deux semaines."],
["Dis que tu as une réservation.|I have a reservation.","Demande où est l’aéroport.|Where is the airport?","Demande l’addition.|The bill, please."]],
["Aider les autres, parler avec assurance","« If…, I will… » = si…, je… : If you need help, I will help. Tu peux maintenant faire de longues phrases.",[
"I work with people in need.|Je travaille avec des personnes dans le besoin.","How can I help you?|Comment puis-je vous aider ?","Our association supports young people.|Notre association soutient les jeunes.","I would like to volunteer.|Je voudrais faire du bénévolat.","Everyone is welcome here.|Tout le monde est le bienvenu ici.","Please fill in this form.|Veuillez remplir ce formulaire.","If you need help, I will be happy to help.|Si vous avez besoin d’aide, je serai heureux de vous aider.","We are looking for a solution together.|Nous cherchons une solution ensemble.","I am passionate about helping others.|J’aime passionnément aider les autres.","Let me explain the situation.|Laissez-moi expliquer la situation.","In my opinion, education is very important.|À mon avis, l’éducation est très importante.","I can speak English with confidence now.|Je peux maintenant parler anglais avec confiance."],
["Propose ton aide à quelqu’un.|How can I help you?","Dis que tu voudrais faire du bénévolat.|I would like to volunteer.","Donne ton avis sur l’éducation.|In my opinion, education is very important."]]
];
var X=[
["Where are you from?|D’où venez-vous ?","How old are you?|Quel âge avez-vous ?","I work in a company.|Je travaille dans une entreprise.","You are welcome.|De rien."],
["What do you do every day?|Que fais-tu chaque jour ?","I get home at six.|Je rentre à six heures.","The weather is hot today.|Il fait chaud aujourd’hui.","We watch television in the evening.|Nous regardons la télévision le soir."],
["I would like to pay in cash.|Je voudrais payer en espèces.","Do you accept mobile money?|Acceptez-vous le mobile money ?","How far is it?|C’est à quelle distance ?","Stop here, please.|Arrêtez-vous ici, s’il vous plaît."],
["I have a fever.|J’ai de la fièvre.","Do you have something for pain?|Avez-vous quelque chose contre la douleur ?","I have been sick for two days.|Je suis malade depuis deux jours.","Drink a lot of water.|Buvez beaucoup d’eau."],
["How was your day?|Comment s’est passée ta journée ?","Let’s go out tonight.|Sortons ce soir.","I miss my family.|Ma famille me manque.","You are a good friend.|Tu es un bon ami."],
["Let me introduce my team.|Laissez-moi présenter mon équipe.","I am in charge of the files.|Je suis chargé des dossiers.","Could you explain this to me?|Pourriez-vous m’expliquer ceci ?","The meeting starts at ten.|La réunion commence à dix heures."],
["Where can I buy a ticket?|Où puis-je acheter un billet ?","Is this seat free?|Cette place est-elle libre ?","I am here for tourism.|Je suis ici pour le tourisme.","The room is very clean.|La chambre est très propre."],
["We help families every week.|Nous aidons des familles chaque semaine.","Tell me more about your project.|Parlez-moi davantage de votre projet.","I believe we can change things.|Je crois que nous pouvons changer les choses.","It was a pleasure talking to you.|Ce fut un plaisir de parler avec vous."]];
X.forEach(function(a,i){W[i][2]=W[i][2].concat(a)});
var MSG=["Bravo, tu avances vraiment ! 🌟","Encore une séance de faite, tu es régulier, c’est ça la clé ! 💪","Magnifique ! Chaque jour, tu parles un peu mieux. 🌿","Tu peux être fier de toi aujourd’hui ! 🎉","Excellent travail, continue comme ça ! 🔥"];
var $=function(i){return document.getElementById(i)},Z=$("zone"),S=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var D={done:[],hist:{},weak:{},seen:{},last:"",xr:0,xd:"",rate:0.85,slow:0},st=D;
try{st=Object.assign(D,JSON.parse(localStorage.getItem("ang2m")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("ang2m",JSON.stringify(st))}catch(e){}}
function say(t){try{S.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=st.rate;S.speak(u)}catch(e){}}
function P(w,i){var x=W[w][2][i].split("|");return{en:x[0],fr:x[1],k:w*20+i,w:w}}
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function ws(t){return t.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean)}
function bub(t){return '<div class="p"><span>🎓</span><p>'+t+'</p></div>'}
function B(c,a,t){return '<button class="'+c+'" '+a+'>'+t+'</button>'}
function mic(target,out,cb){
 if(!SR){out.className="no";out.textContent="Micro indisponible : ouvre le site avec Google Chrome.";return}
 var r=new SR();r.lang="en-US";r.maxAlternatives=3;out.className="d";out.textContent="Je t’écoute… parle maintenant.";
 r.onresult=function(e){var best=0,said="",t=ws(target);
  for(var i=0;i<e.results[0].length;i++){var s=e.results[0][i].transcript,d=ws(s),n=t.filter(function(m){return d.indexOf(m)>-1}).length/t.length;if(n>=best){best=n;said=s}}
  var miss=t.filter(function(m){return ws(said).indexOf(m)<0});
  if(best>=0.7){out.className="ok";out.textContent="Bien dit ! 👏"}
  else{out.className="no";out.textContent="J’ai entendu : « "+said+" ». Il manquait : "+(miss.slice(0,4).join(", ")||"…")+". Écoute et réessaie."}
  if(cb)cb(best>=0.7)};
 r.onerror=function(e){out.className="no";out.textContent=e.error==="not-allowed"?"Autorise le micro dans Chrome, puis réessaie.":"Je n’ai rien entendu. Réessaie."};
 try{r.start()}catch(e){}}
var ss=null;
function ymd(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function wk(day){return Math.floor((day-1)/7)}
function pw(w){var a=[],i;for(i=0;i<W[w][2].length;i++)a.push(P(w,i));return a}
function low(a,n){return sh(a).sort(function(x,y){return (st.seen[x.k]||0)-(st.seen[y.k]||0)}).slice(0,n)}
function home(){
 var dn=st.done.length,fin=dn>=56,n=Math.min(56,dn+1),td=st.last===ymd()&&dn>0,w=wk(n),h='<h1>Mon anglais en 2 mois</h1>';
 h+='<div class="hero"><span>'+(fin?"Programme terminé !":td?"Jour "+dn+" terminé ✅ · Demain, jour "+n:"Jour "+n+" sur 56 · Semaine "+(w+1))+'</span><b>'+W[w][0]+'</b></div>';
 h+='<div class="bar"><i style="width:'+(dn/56*100)+'%"></i></div>';
 h+=bub(td?"Ta série du jour est faite, bravo ! Tu peux continuer autant que tu veux : à chaque fois, de nouvelles phrases et des exercices différents. Demain, le jour "+n+" s’ouvre.":"D’abord ta série du jour : tu écoutes, tu comprends, tu répètes, tu parles avec moi. Ensuite, tu pourras continuer sans limite.");
 if(!td&&!fin)h+=B("g",'data-go="'+n+'"',"Commencer la série du jour");
 if(dn>0)h+=B(td||fin?"g":"k",'data-bonus="1"',"Continuer à s’entraîner");
 h+=B("k",'data-aud="1"',"🎧 Cours audio");
 if(st.xd===ymd()&&st.xr)h+='<p class="d">Séries bonus faites aujourd’hui : '+st.xr+'</p>';
 var ks=Object.keys(st.hist).map(Number).sort(function(a,b){return a-b}).slice(-14);
 if(ks.length){h+='<h2>Ma progression</h2><div class="bx"><div class="gr">'+ks.map(function(k){return'<i style="height:'+Math.max(4,st.hist[k])+'%" title="Jour '+k+'"></i>'}).join("")+'</div><div class="d">Score des derniers jours (en %)</div></div>'}
 h+='<h2>Vitesse de la voix</h2><div class="bx"><input type="range" id="rt" min="0.5" max="1.1" step="0.05" value="'+st.rate+'"><div class="d" id="rv">'+st.rate+'</div></div>';
 h+='<h2>Le programme</h2>'+W.map(function(x,i){return'<details'+(i==w?" open":"")+'><summary>Semaine '+(i+1)+' · '+x[0]+'</summary><p class="d">'+x[1]+'</p></details>'}).join("");
 Z.innerHTML=h;
 $("rt").oninput=function(){st.rate=+this.value;$("rv").textContent=st.rate;save()};
 window.scrollTo(0,0)}
function start(day,bonus){
 var w=bonus?Math.min(7,wk(Math.max(st.done.length,1))):wk(day),top=bonus?Math.min(7,w+1):w,pool=[],tp=[],x,ph,rest,rv;
 for(x=0;x<=top;x++){pool=pool.concat(pw(x));W[x][3].forEach(function(s){tp.push(s)})}
 ph=low(bonus?pool:pw(w),6);
 rest=pool.filter(function(p){return ph.every(function(q){return q.k!=p.k})});
 rv=low(rest.filter(function(p){return st.weak[p.k]}),4);
 if(rv.length<4)rv=rv.concat(low(rest.filter(function(p){return rv.every(function(q){return q.k!=p.k})}),4-rv.length));
 ss={day:bonus?Math.floor(Math.random()*5):day,real:day,bonus:bonus,w:w,ph:ph,pool:pool,q:sh(ph.concat(rv)),qi:0,sc:0,err:[],ri:0,ti:0,step:0,tp:bonus?sh(tp).slice(0,3):W[w][3],an:false};
 ss.q.forEach(function(p){st.seen[p.k]=(st.seen[p.k]||0)+1});save();
 run()}
function run(){var f=[learn,rep,quiz,talk,recap][ss.step];if(f)f();else home();window.scrollTo(0,0)}
function nxt(){ss.step++;run()}
function head(t){return '<div class="bar"><i style="width:'+(ss.step/5*100)+'%"></i></div><div class="d">Étape '+(ss.step+1)+' sur 5 · '+t+'</div>'}
function learn(){var h=head("Découvrir")+bub("Écoute chaque phrase. Comprends d’abord le sens en français, puis touche pour voir l’anglais.");
 ss.ph.forEach(function(p,i){h+='<div class="c">'+B("a",'data-say="'+p.en+'"',"🔊")+'<div><b>'+p.fr+'</b><div class="en" id="e'+i+'" style="display:none">'+p.en+'</div><button class="l" data-show="e'+i+'">Voir l’anglais</button></div></div>'});
 Z.innerHTML=h+B("g","data-next=1","Suite : je répète")}
function rep(){var p=ss.ph[ss.ri];
 Z.innerHTML=head("Répéter")+bub("Écoute, puis dis la phrase à voix haute. Ça doit sortir de ta bouche, pas seulement de ta tête !")+
 '<div class="bx"><div class="d">'+(ss.ri+1)+' / 6</div><div class="en">'+p.fr+'</div></div>'+B("j",'data-say="'+p.en+'"',"🔊 Écouter")+B("k",'data-mic="'+p.en+'" data-k="'+p.k+'"',"🎤 Je répète")+'<div id="out" class="d" style="min-height:48px"></div>'+B("g","data-rn=1",ss.ri<5?"Phrase suivante":"Suite : le quiz");setTimeout(function(){say(p.en)},300)}
function ans(ok){
 if(ss.an)return;ss.an=true;var p=ss.q[ss.qi];
 if(ok)ss.sc++;else{ss.err.push(p);st.weak[p.k]=3;save()}
 $("fb").innerHTML=bub(ok?"Bonne réponse !":"Pas grave. Ça veut dire : « "+p.fr+" ». Astuce : "+W[p.w][1])+'<div class="bx"><div class="en">'+p.en+'</div></div>'+B("g","data-qn=1",ss.qi<ss.q.length-1?"Suivant":"Suite : je parle avec le prof");say(p.en)}
function ro(){var r=ss.ro,p=ss.q[ss.qi],u=r.a.map(function(i){return'<button class="ch" data-ra="'+i+'">'+r.w[i]+'</button>'}).join(""),f=r.o.filter(function(i){return r.a.indexOf(i)<0}).map(function(i){return'<button class="ch" data-rc="'+i+'">'+r.w[i]+'</button>'}).join("");
 Z.innerHTML=head("Quiz")+'<div class="d">Question '+(ss.qi+1)+' / '+ss.q.length+'</div>'+B("j",'data-say="'+p.en+'"',"🔊 Écouter")+'<div class="bx"><div class="d">Remets les mots dans l’ordre</div><div class="en">'+p.fr+'</div></div><div class="bx" style="min-height:64px">'+u+'</div><div>'+f+'</div><div id="fb"></div>'}
function quiz(){
 if(ss.qi>=ss.q.length){nxt();return}
 ss.an=false;
 var p=ss.q[ss.qi],t=(ss.qi+ss.day)%5,wd=p.en.split(" "),h=head("Quiz")+'<div class="d">Question '+(ss.qi+1)+' / '+ss.q.length+'</div>',ds=sh(ss.pool.filter(function(x){return x.k!=p.k})),o;
 if(t==4&&!SR)t=1;if(t==2&&wd.length<3)t=1;
 if(t==2){ss.ro={w:wd,o:sh(wd.map(function(_,i){return i})),a:[]};ro();return}
 if(t==4){Z.innerHTML=h+'<div class="bx"><div class="d">Dis cette phrase en anglais</div><div class="en">'+p.fr+'</div></div>'+B("k",'data-mic="'+p.en+'" data-qs="1"',"🎤 Je parle")+'<div id="out" class="d" style="min-height:48px"></div><button class="l" data-show="mod">Voir la réponse</button><div class="bx" id="mod" style="display:none"><div class="en">'+p.en+'</div></div>'+B("q","data-skip=1","Passer")+'<div id="fb"></div>';return}
 if(t==3){var ci=0,core,oc=[];wd.forEach(function(x,i){if(x.replace(/[^A-Za-z’]/g,"").length>wd[ci].replace(/[^A-Za-z’]/g,"").length)ci=i});
  core=wd[ci].replace(/[^A-Za-z’]/g,"");
  ds.forEach(function(x){x.en.split(" ").forEach(function(z){var c=z.replace(/[^A-Za-z’]/g,"");if(c.length>2&&c!=core&&oc.indexOf(c)<0)oc.push(c)})});
  oc=sh(oc).slice(0,2);
